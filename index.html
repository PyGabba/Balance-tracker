<!DOCTYPE html>

<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111119" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanza" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Finanza Tracker</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body, #root { height: 100%; }
      body { background: #111119; font-family: 'DM Sans', sans-serif; overflow: hidden; }
      #root { overflow-y: auto; -webkit-overflow-scrolling: touch; }

      /* TabBar floating pill — fixed at bottom, above safe area */
      .tabbar-fixed {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        padding-top: 6px;
        background: transparent;
      }

      /* Solid block that fills the home indicator zone below the pill */
      .tabbar-safe-filler {
        height: env(safe-area-inset-bottom, 0px);
        background: #111119;
      }

      /* Content area: leave room for pill + safe area */
      .scroll-content {
        padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
      }
      .tabbar-wrapper { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
