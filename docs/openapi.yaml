openapi: 3.0.3
info:
  title: Balance Tracker API
  version: "1.0"
  description: >
    Household finance tracker API. This spec covers every route in
    `server/index.js` — auth, household/settings, transactions (+ trash),
    accounts, goals, positions, trips (+ expenses/sharing/guest access),
    backup/restore, widget, calendar feed, and admin (blacklist + metrics).
    It is a snapshot maintained by hand alongside the code (MOD-024), not
    generated. See ./API.md for pagination, idempotency, rate limiting,
    and the full error-code reference this spec references but doesn't
    repeat, plus the "Known inconsistencies" notes on error/response-shape
    drift across older routes.
servers:
  - url: /api
    description: Same-origin (production, via the Vercel proxy) or http://localhost:3001/api in development

security:
  - cookieAuth: []

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: httpOnly JWT session cookie, set by /auth/login or /auth/register.
    capabilityTokenQuery:
      type: apiKey
      in: query
      name: key
      description: Widget/calendar capability token — unrelated to household auth, grants only the narrow surface it was issued for.
    adminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Must match the server's ADMIN_SECRET environment variable. Unrelated to household auth.

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          description: Structured error shape (MOD-022) — used by every route, including rate-limit responses.
          properties:
            code:
              type: string
              example: UNKNOWN_PARTICIPANT
            message:
              type: string
            fields:
              type: object
              additionalProperties: true
          required: [code, message]

    Split:
      type: object
      properties:
        personaId: { type: string }
        quota:
          type: number
          minimum: 0
          maximum: 100
      required: [personaId, quota]

    ExtraPersona:
      type: object
      properties:
        id: { type: string, maxLength: 50 }
        nome: { type: string, maxLength: 100 }
      required: [id, nome]

    Ricorrenza:
      type: object
      nullable: true
      properties:
        frequenza:
          type: string
          enum: [settimanale, mensile, trimestrale, annuale]
        prossimaData:
          type: string
          format: date
        variabile:
          type: boolean
      required: [frequenza, prossimaData]

    TransactionInput:
      type: object
      required: [tipo, importo, data]
      properties:
        tipo:
          type: string
          enum: [uscita, entrata, saldo, trasferimento]
        importo:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: >
            Rounded server-side via lib/money.js's integer-minor-units
            round-trip (MOD-016). The canonical stored field is still this
            decimal number (e.g. 12.34) — see Transaction.importoMinorUnits
            for the derived integer-cents companion field the server also
            stores alongside it.
        data:
          type: string
          format: date
        categoria: { type: string, maxLength: 50 }
        descrizione: { type: string, maxLength: 500 }
        pagatoDa:
          type: string
          nullable: true
          description: Household member or extraPersone id. Required for tipo=uscita if splits are given.
        ricevutoDa: { type: string, nullable: true }
        intestataA: { type: string, nullable: true, description: "Required for tipo=entrata to attribute income to a person." }
        splits:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Split" }
          description: If present, quotas must sum to 100 (± 0.05 tolerance) and every personaId must be a known participant (MOD-002).
        extraPersone:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/ExtraPersona" }
          description: Ad-hoc participants declared on this same request (e.g. a one-off guest), not required to be household members.
        contoId: { type: string, nullable: true, description: "Account id — must belong to this household (MOD-001/009)." }
        contoDa: { type: string, nullable: true, description: "Required for tipo=trasferimento." }
        contoA: { type: string, nullable: true, description: "Required for tipo=trasferimento; must differ from contoDa." }
        valuta: { type: string, nullable: true, description: "ISO 4217-ish currency code, if different from the household's base currency." }
        ricorrenza: { $ref: "#/components/schemas/Ricorrenza" }
        daVerificare: { type: boolean }

    Transaction:
      allOf:
        - $ref: "#/components/schemas/TransactionInput"
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            importoMinorUnits:
              type: integer
              description: >
                Integer minor units (cents) derived from importo (MOD-016).
                Set on every write since the MOD-016 migration; backfilled
                on pre-migration documents by migration 001 (see
                server/migrations/). Not yet the canonical stored field —
                still purely a derived companion, safe to ignore.
            importoOriginale: { type: number, description: "Present if valuta conversion was applied." }
            importoOriginaleMinorUnits: { type: integer, description: "Minor-units companion of importoOriginale, same caveats as importoMinorUnits." }
            tassoCambio: { type: number }
            tassoCambioObsoleto: { type: boolean, description: "True if the exchange rate used was a stale cache, not freshly fetched." }
            recurrenceOccurrenceKey: { type: string, description: "Present on transactions generated by the recurring job." }
            clientId: { type: string, description: "Optional client-supplied correlation id for offline-created transactions." }
          required: [id]

    TransactionsPage:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
      required: [transactions, nextCursor, hasMore]

    Account:
      type: object
      properties:
        id: { type: string }
        nome: { type: string, maxLength: 60 }
        icona: { type: string, maxLength: 8, default: "🏦" }
        saldoIniziale: { type: number }
        saldoInizialeMinorUnits: { type: integer, description: "Integer-cents companion of saldoIniziale (MOD-016) — see Transaction.importoMinorUnits." }
        createdAt: { type: string, format: date-time }
      required: [id, nome]

    Goal:
      type: object
      properties:
        id: { type: string }
        nome: { type: string, maxLength: 100 }
        targetAmount: { type: number }
        targetAmountMinorUnits: { type: integer, description: "Integer-cents companion of targetAmount (MOD-016)." }
        targetDate: { type: string, format: date, nullable: true }
        currentAmount: { type: number }
        currentAmountMinorUnits: { type: integer, description: "Integer-cents companion of currentAmount (MOD-016)." }
        contributionType: { type: string, enum: [manual, fixed, percentage] }
        contributionValue: { type: number }
        autoAdd: { type: boolean }
        contoId:
          type: string
          nullable: true
          description: Must belong to this household (MOD-009).
      required: [id, nome, targetAmount]

    Position:
      type: object
      description: >
        One buy or sell trade. Portfolio value/cost-basis is computed
        client- and server-side from the full set of a household's
        Positions per ticker using single average-cost accounting — see
        "Cost-basis accounting (MOD-018)" in API.md for the full method,
        partial/full-sale/oversell behavior, and known limitations
        (no fees, no cross-currency conversion despite the valuta field
        below). This is portfolio tracking, not tax accounting — no
        jurisdiction's tax-lot rules are modeled.
      properties:
        id: { type: string }
        ticker: { type: string, maxLength: 20 }
        nome: { type: string }
        quantita: { type: number }
        prezzoAcquisto: { type: number }
        prezzoAcquistoMinorUnits: { type: integer, description: "Integer-cents companion of prezzoAcquisto (MOD-016)." }
        dataAcquisto: { type: string, format: date }
        valuta:
          type: string
          default: EUR
          description: >
            Recorded but NOT used in cost-basis/value calculations today —
            every position is summed as if it were the household's base
            currency regardless of this field (MOD-018 known limitation).
        note: { type: string }
        tipo: { type: string, enum: [buy, sell], default: buy }
      required: [id, ticker, quantita, prezzoAcquisto]

    TripPartecipante:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        emoji: { type: string }
        colore: { type: string }
      required: [id, nome]

    TripExpense:
      type: object
      properties:
        id: { type: string, description: "UUID, not a MongoDB ObjectId." }
        pagatoDa:
          type: string
          description: Must be a participant of THIS trip (trip.partecipanti), not necessarily a household member (MOD-009).
        importo: { type: number, minimum: 0, exclusiveMinimum: true }
        importoMinorUnits: { type: integer, description: "Integer-cents companion of importo (MOD-016)." }
        descrizione: { type: string, maxLength: 200 }
        categoria: { type: string, maxLength: 50 }
        data: { type: string, format: date }
        splits:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Split" }
      required: [id, pagatoDa, importo]

    Trip:
      type: object
      properties:
        id: { type: string }
        nome: { type: string, maxLength: 100 }
        descrizione: { type: string, maxLength: 500 }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        partecipanti:
          type: array
          items: { $ref: "#/components/schemas/TripPartecipante" }
        expenses:
          type: array
          items: { $ref: "#/components/schemas/TripExpense" }
          description: "Embedded, capped at 2000 (hard limit) with a warning logged past 300 (MOD-019)."
        settled: { type: boolean }
        settlementStatus:
          type: string
          nullable: true
          enum: [open, settling, settled]
          description: Internal state machine for crash-safe auto-settlement (MOD-008). Not meaningful for manually-settled trips.
        autoSettled: { type: boolean }
      required: [id, nome]

    MetricsSnapshot:
      type: object
      properties:
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: number }
        requests:
          type: object
          properties:
            total: { type: integer }
            byStatusClass:
              type: object
              properties:
                "2xx": { type: integer }
                "3xx": { type: integer }
                "4xx": { type: integer }
                "5xx": { type: integer }
        routes:
          type: object
          additionalProperties:
            type: object
            properties:
              count: { type: integer }
              errorCount: { type: integer }
              errorRate: { type: number }
              latencyMsP50: { type: number, nullable: true }
              latencyMsP95: { type: number, nullable: true }
              latencyMsP99: { type: number, nullable: true }
        jobs:
          type: object
          additionalProperties:
            type: object
            properties:
              runs: { type: integer }
              failures: { type: integer }
              lastRunAt: { type: string, format: date-time, nullable: true }
              lastFailureAt: { type: string, format: date-time, nullable: true }
              lastError: { type: string, nullable: true }
        syncConflictsObserved: { type: integer }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: See API.md#idempotency. Recommended for all create requests.
    TransactionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string }
    GoalId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TripId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated, or session invalid/expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Entity not found (or not owned by this household).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited. See API.md#rate-limiting.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /auth/register:
    post:
      summary: Create a new household
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, persone, pin]
              properties:
                nome: { type: string }
                persone:
                  type: array
                  items:
                    type: object
                    properties: { nome: { type: string } }
                pin: { type: string }
                email: { type: string, nullable: true }
      responses:
        "201": { description: Household created; session cookie set. }
        "409": { description: PIN or email already in use. }

  /auth/login:
    post:
      summary: Log in to an existing household
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
                deviceId: { type: string, nullable: true }
      responses:
        "200": { description: Session cookie set; household data returned. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      summary: Revoke the current session
      responses:
        "200": { description: Logged out. }

  /auth/pin:
    put:
      summary: Change the household PIN
      description: Revokes every existing session for the household and issues a fresh one. Clears requiresPinChange.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPin]
              properties: { newPin: { type: string } }
      responses:
        "200": { description: PIN changed; new session cookie set. }

  /auth/forgot-pin/request:
    post:
      summary: Request a PIN-reset code by email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string } }
      responses:
        "200": { description: "Always { ok: true } regardless of whether the email exists — no account enumeration." }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-pin/confirm:
    post:
      summary: Confirm a PIN-reset code and set a new PIN
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPin]
              properties:
                email: { type: string }
                code: { type: string, description: "6-digit code, 15-min expiry, max 5 attempts." }
                newPin: { type: string }
      responses:
        "200": { description: PIN reset; all prior sessions revoked. }
        "400": { description: Invalid, expired, or exhausted code. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/recovery-email:
    put:
      summary: Attach or update the household's recovery email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string } }
      responses:
        "200": { description: Updated. }

  /auth/household:
    delete:
      summary: Permanently delete the household and all its data
      description: Irreversibly deletes every collection's data for this household (transactions, accounts, goals, trips, positions, pinResets) and the household itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties: { pin: { type: string, description: Must match the household's current PIN. } }
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /household:
    get:
      summary: Get household profile and settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  nome: { type: string }
                  persone: { type: array, items: { $ref: "#/components/schemas/TripPartecipante" } }
                  hasRecoveryEmail: { type: boolean }
                  valutaBase: { type: string }

  /household/valuta:
    put:
      summary: Change the household's base currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valutaBase]
              properties:
                valutaBase: { type: string, description: "Any 3-letter ISO-4217-shaped code, not a hardcoded whitelist." }
      responses:
        "200": { description: Updated. }

  /exchange-rates:
    get:
      summary: Get the household's base-currency exchange-rate table
      description: Cached server-side for 24h. Never falls back to a 1:1 rate (MOD-005) — unavailable rates surface as an error instead.
      responses:
        "200": { description: OK }
        "503": { description: Rate provider unavailable and no usable cache. }

  /categorie:
    get:
      summary: Get the household's custom expense categories
      responses:
        "200": { description: "Category list, or null if unset (client falls back to its own defaults)." }
    put:
      summary: Set the household's custom expense categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categorie]
              properties:
                categorie:
                  type: array
                  maxItems: 100
                  items: {}
      responses:
        "200": { description: "{ ok: true } — no created entity in the response." }

  /trip-categories:
    get:
      summary: Get the household's custom trip-expense categories
      responses:
        "200": { description: "Same shape as /categorie, separate field." }
    put:
      summary: Set the household's custom trip-expense categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categorie]
              properties:
                categorie:
                  type: array
                  maxItems: 100
                  items: {}
      responses:
        "200": { description: "{ ok: true }." }

  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: boolean }

  /transactions:
    get:
      summary: List transactions (paginated)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 2000 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: tipo
          in: query
          schema: { type: string, enum: [uscita, entrata, saldo, trasferimento] }
        - name: categoria
          in: query
          schema: { type: string }
        - name: pagatoDa
          in: query
          schema: { type: string }
        - name: contoId
          in: query
          schema: { type: string }
        - name: meseAnno
          in: query
          schema: { type: string, example: "2026-08" }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      summary: Create a transaction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: Currency conversion requested but no exchange rate is available. }
        "425": { description: A request with the same Idempotency-Key is still being processed. }

  /transactions/{id}:
    put:
      summary: Partially update a transaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Same fields as TransactionInput, all optional — only fields present are validated/changed.
              allOf: [{ $ref: "#/components/schemas/TransactionInput" }]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Soft-delete a transaction (moves to trash)
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/trash:
    get:
      summary: List soft-deleted transactions
      description: Most recently deleted first. Also auto-purged after 30 days by the svuotaCestinoScaduto background job.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Transaction" } }

  /transactions/{id}/restore:
    post:
      summary: Restore a soft-deleted transaction
      parameters: [{ $ref: "#/components/parameters/TransactionId" }]
      responses:
        "200": { description: Restored. }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/{id}/permanent:
    delete:
      summary: Permanently delete a single trashed transaction
      parameters: [{ $ref: "#/components/parameters/TransactionId" }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/trash/empty:
    delete:
      summary: Permanently delete everything currently in trash
      responses:
        "200": { description: Emptied. }

  /stats/debiti:
    get:
      summary: Debt-settlement matrix
      description: Who owes whom, reduced to the minimal number of transfers needed to settle.
      responses:
        "200": { description: OK }

  /stats/summary:
    get:
      summary: Aggregated transaction totals
      description: "Grouped by (tipo, categoria, pagatoDa), optionally filtered by month."
      parameters:
        - name: meseAnno
          in: query
          schema: { type: string, example: "2026-08" }
      responses:
        "200": { description: OK }

  /accounts:
    get:
      summary: List accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Account" } }
    post:
      summary: Create an account
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Account" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /accounts/{id}:
    put:
      summary: Update an account
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Account" }
      responses:
        "200": { description: Updated. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete an account
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/NotFound" }

  /goals:
    get:
      summary: List savings goals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Goal" } }
    post:
      summary: Create a savings goal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Goal" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Goal" }
        "400": { description: "contoId does not belong to this household, or missing required fields." }

  /goals/{id}:
    put:
      summary: Update a savings goal
      parameters: [{ $ref: "#/components/parameters/GoalId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Goal" }
      responses:
        "200": { description: Updated. }
        "400": { description: "contoId does not belong to this household." }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a savings goal
      parameters: [{ $ref: "#/components/parameters/GoalId" }]
      responses:
        "200": { description: Deleted. }

  /positions:
    get:
      summary: List portfolio positions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Position" } }
    post:
      summary: Record a buy/sell position
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Position" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }

  /positions/{id}:
    delete:
      summary: Delete a position
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted. }

  /positions/prices:
    get:
      summary: Get manual price overrides
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  manualPrices: { type: object, additionalProperties: { type: number } }
    put:
      summary: Set manual price overrides
      description: The only price source — the live-quote endpoint is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manualPrices]
              properties:
                manualPrices:
                  type: object
                  additionalProperties: { type: number }
                  maxProperties: 200
      responses:
        "200": { description: "{ ok: true }." }

  /quotes:
    get:
      summary: Live stock/fund quote lookup
      description: Disabled — always 410. Kept only so old clients get a clear error instead of a 404.
      responses:
        "410": { description: "Gone — \"Usa i prezzi manuali.\"" }

  /trips:
    get:
      summary: List trips
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Trip" } }
    post:
      summary: Create a trip
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Trip" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }

  /trips/{id}:
    put:
      summary: Update a trip
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Trip" }
      responses:
        "200": { description: Updated. }
    delete:
      summary: Delete a trip
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      responses:
        "200": { description: Deleted. }

  /trips/{id}/expenses:
    post:
      summary: Add an expense to a trip
      description: >
        pagatoDa and every splits[].personaId must be a participant of THIS
        trip (trip.partecipanti) — not the household's participant list
        (MOD-009). Subject to the 300-warn/2000-hard-limit embedded-array
        guard (MOD-019), enforced atomically at write time.
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripExpense" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripExpense" }
        "400":
          description: Validation failed, trip already settled, or the trip is at its expense-count hard limit.

  /trips/{id}/expenses/{expenseId}:
    delete:
      summary: Remove an expense from a trip
      parameters:
        - $ref: "#/components/parameters/TripId"
        - name: expenseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted. }

  /trips/{id}/share:
    post:
      summary: Create (or replace) a guest share link for a trip
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      responses:
        "200":
          description: The plaintext token, returned exactly once — only its hash is stored server-side.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresInDays: { type: integer, example: 30 }
    delete:
      summary: Revoke a trip's share link
      parameters: [{ $ref: "#/components/parameters/TripId" }]
      responses:
        "200": { description: Revoked. }

  /trips/shared/{token}:
    get:
      summary: Guest view of a shared trip (no household auth)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: A stripped-down trip view (name, dates, participants, expenses, settled status).
        "404": { description: "Link invalid, expired, or revoked." }

  /trips/shared/{token}/join:
    post:
      summary: Join a shared trip as a guest
      security: []
      description: Idempotent by normalized name — rejoining with the same name returns the existing participant instead of duplicating.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties: { nome: { type: string } }
      responses:
        "200": { description: Joined; returns the participant record. }
        "404": { description: "Link invalid, expired, or revoked." }

  /trips/shared/{token}/expenses:
    post:
      summary: Log an expense on a shared trip as a guest
      security: []
      description: Same validation/limits as the household version, plus a friendlier error for logging an expense before joining.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripExpense" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripExpense" }
        "400": { description: Validation failed, trip settled, guest hasn't joined, or expense-count limit reached. }
        "404": { description: "Link invalid, expired, or revoked." }

  /widget-key:
    post:
      summary: Create (or rotate) the household's widget capability token
      responses:
        "200":
          description: The plaintext key, returned exactly once.
          content:
            application/json:
              schema:
                type: object
                properties: { key: { type: string } }
    delete:
      summary: Revoke the widget capability token
      responses:
        "200": { description: Revoked. }

  /widget:
    get:
      summary: Read-only aggregate summary for a home-screen widget
      security:
        - capabilityTokenQuery: []
      responses:
        "200":
          description: >
            Aggregate numbers only — account balances, this-month income/
            expense totals, portfolio value. Never the raw transaction
            list. Computed server-side via a MongoDB aggregation, not by
            loading the household's full transaction history (MOD-020).
        "401": { description: Missing or invalid capability token. }

  /widget/transaction:
    post:
      summary: Create a transaction via the widget's minimal write surface
      security:
        - capabilityTokenQuery: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, importo]
              properties:
                tipo: { type: string, enum: [uscita, entrata] }
                importo: { type: number }
                data: { type: string, format: date }
                categoria: { type: string }
                pagatoDa: { type: string, nullable: true }
                intestataA: { type: string, nullable: true }
                contoId: { type: string, nullable: true }
                splits:
                  type: array
                  nullable: true
                  items: { $ref: "#/components/schemas/Split" }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /backup:
    get:
      summary: Full JSON export of the household's data
      description: "Transactions, accounts, goals, trips, positions, manual prices, plus household metadata. formato: \"balance-tracker-backup\", versione: 1."
      responses:
        "200": { description: OK }

  /backup/restore:
    post:
      summary: Restore a backup
      description: >
        Re-imports a backup produced by GET /backup. Additive, not
        destructive — nothing existing is deleted first; restored rows get
        a restoredAt timestamp. Account ids are remapped (old→new) so
        restored transactions/goals still point at the right restored
        account. Custom categories are only restored if the household
        currently has none set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A document previously returned by GET /backup.
      responses:
        "200": { description: Restored. }
        "400": { description: Malformed or unrecognized backup format. }

  /calendar-key:
    post:
      summary: Issue a calendar-subscription capability key
      responses:
        "200":
          description: The plaintext key, returned exactly once.
          content:
            application/json:
              schema:
                type: object
                properties: { key: { type: string } }
    delete:
      summary: Revoke the calendar-subscription key
      responses:
        "200": { description: Revoked. }

  /calendar.ics:
    get:
      summary: iCalendar feed of recurring-transaction templates
      description: Read-only RFC 5545 feed for "subscribe by URL" in Google/Apple/Outlook calendars. No write counterpart.
      security:
        - capabilityTokenQuery: []
      responses:
        "200":
          description: OK
          content:
            text/calendar: {}
        "401": { description: Missing or invalid capability token. }

  /admin/blacklist:
    get:
      summary: List blocked IP/device keys
      security:
        - adminSecret: []
      responses:
        "200": { description: OK }
        "401": { description: Missing/invalid X-Admin-Secret. }
        "503": { description: ADMIN_SECRET not configured on the server. }
    post:
      summary: Block an IP or device
      description: Permanent block, independent of the temporary lockout mechanism.
      security:
        - adminSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, example: "ip:1.2.3.4", description: "e.g. ip:1.2.3.4 or device:<uuid>." }
                reason: { type: string, nullable: true }
      responses:
        "200": { description: Blocked. }
        "401": { description: Missing/invalid X-Admin-Secret. }

  /admin/blacklist/{key}:
    delete:
      summary: Un-block an IP or device
      security:
        - adminSecret: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: "e.g. ip:1.2.3.4 or device:<uuid>. Wildcard path segment on the server side to allow the embedded colon."
      responses:
        "200": { description: Unblocked. }
        "401": { description: Missing/invalid X-Admin-Secret. }

  /admin/metrics:
    get:
      summary: Operational metrics snapshot (MOD-023)
      security:
        - adminSecret: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsSnapshot" }
        "401": { description: Missing/invalid X-Admin-Secret. }
        "503": { description: ADMIN_SECRET not configured on the server. }
